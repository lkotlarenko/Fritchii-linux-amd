name: Linux AppImage

on:
  push:
    branches: [main]
    tags: ['linux-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Arch x86_64 Release and tests
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 180
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      version: ${{ steps.identity.outputs.version }}
    env:
      JOBS: '2'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Install dependencies in the disposable CI container
        run: |
          pacman -Syu --noconfirm --needed \
            clang lld cmake ninja git python curl pkgconf ccache \
            qt6-base qt6-charts qt6-tools sdl3 ffmpeg openssl zlib lz4 \
            libusb libpulse alsa-lib libxkbcommon libxkbcommon-x11 \
            vulkan-headers vulkan-icd-loader vulkan-swrast mesa \
            glslang spirv-tools nasm autoconf automake libtool boost \
            patchelf desktop-file-utils xorg-server-xvfb xorg-xauth ttf-dejavu ripgrep

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Record source and validate release tag
        id: identity
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < dist/frizti_version.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^linux-v[0-9]+\.[0-9]+(\.[0-9]+)?(-r[1-9][0-9]*)?$ ]]
            tag_version=${REF_NAME#linux-v}
            tag_version=${tag_version%-r*}
            [[ "$tag_version" == "$version" ]]
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p build/logs
          pacman -Q > build/logs/ci-packages.txt
          clang++ --version > build/logs/ci-compiler.txt
          cmake --version > build/logs/ci-cmake.txt

      - name: Cache dependencies and compiler objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/cpm
            .ccache
          key: arch-linux-${{ hashFiles('cpmfile.json', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            arch-linux-${{ hashFiles('cpmfile.json', 'CMakeLists.txt') }}-

      - name: Build Release and run CTest
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-linux.sh -DENABLE_DEBUG_TOOLS=OFF \
            -DVulkanHeaders_FORCE_BUNDLED=ON -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee build/logs/ci-build.log
          python3 tools/nx2/test_linux_benchmark.py
          python3 tools/nx2/test_debug_mcp.py
          python3 tools/nx2/test_release_privacy.py

      - name: Fetch checksum-pinned packaging tools
        run: ./scripts/fetch-appimage-tools.sh

      - name: Package AppImage
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/package-appimage.sh 2>&1 | tee build/logs/ci-appimage.log
          (cd artifacts && sha256sum --check ./*.AppImage.sha256)

      - name: Test AppImage home and settings under Xvfb
        run: xvfb-run -a ./scripts/test-linux-appimage.sh

      - name: Upload AppImage and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fritchii-linux-x86_64
          path: |
            artifacts/*.AppImage
            artifacts/*.AppImage.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-build-logs
          path: |
            build/logs/
            build/linux-release/Testing/Temporary/
            build/runtime-tests/*.log
            build/runtime-tests/*.txt
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish tagged Linux release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/linux-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fritchii-linux-x86_64
          path: artifacts

      - name: Publish release without replacing existing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum --check ./*.AppImage.sha256)
          remote_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          [[ "$remote_sha" == "$SOURCE_SHA" ]]
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; retaining its existing assets unchanged.'
            exit 0
          fi
          cat > notes.md <<EOF
          Native Fritchii $VERSION for x86_64 Arch/CachyOS Linux, source $SOURCE_SHA.

          Includes the Qt6 GUI, Wayland/XWayland plugins and the official v54 preparation recipe.
          Built with Clang Release, two jobs, bundled fmt; automatic Windows updater disabled.
          CTest and an isolated Xvfb home/settings smoke test passed. CI has no RX 7600 or game data;
          this is not a gameplay performance validation. See README-LINUX.md and the optimization ledger.

          Download the AppImage and checksum, verify with sha256sum, make it executable and run it.
          Host Mesa/Vulkan drivers are required. Older glibc distributions are not supported by this Arch build.
          Saves and caches remain in fritchii-native/eden; new translator versions may prepare shaders once.
          No games, keys, firmware or user profiles are included. Keep the prior release for rollback.
          EOF
          gh release create "$TAG" artifacts/*.AppImage artifacts/*.AppImage.sha256 \
            --verify-tag --title "Fritchii $VERSION — native Linux ($TAG)" --notes-file notes.md
